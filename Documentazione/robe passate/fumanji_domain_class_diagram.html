<style>
#domain-diagram svg.classDiagram .row-rect-odd path,
#domain-diagram svg.classDiagram .row-rect-odd rect,
#domain-diagram svg.classDiagram .row-rect-even path,
#domain-diagram svg.classDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="domain-diagram"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const diagramSource = `classDiagram
    class Game {
        -currentPlayerIndex : int
        -winner : Player
        -lastRoll : int
        +playTurn()
        +moveForwardBy()
        +moveBackwardBy()
        +addSnack()
        +addDrink()
    }
    class Board {
        -finishPosition : int
        -directionChoiceEnabled : boolean
        -mandatoryCheckpointEnabled : boolean
    }
    class Player {
        -name : String
        -position : int
        -snack : int
        -drink : int
        -checkpoint : int
    }
    class Dice {
        +roll() int
    }
    class Square {
        -position : int
        +applyEffect()
        +getNextPositions()
        +isMandatoryStop()
    }
    class InteractiveSquare {
        <<interface>>
    }
    class StartOverSquare
    class MoveBackSquare {
        -steps : int
    }
    class MoveForwardSquare {
        -steps : int
    }
    class RollAgainSquare
    class SnackSquare {
        -amount : int
    }
    class DrinkSquare {
        -amount : int
    }
    class ObligationSquare
    class CheckpointSquare
    class BivioSquare {
        -nextPositions : List~Integer~
        -previousPositions : List~Integer~
    }
    class PortalSquare {
        -linkedPositions : List~Integer~
    }

    Game "1" *-- "1" Board
    Game "1" *-- "1..*" Player
    Game "1" *-- "1" Dice
    Board "1" *-- "0..*" Square
    Square <|-- StartOverSquare
    Square <|-- MoveBackSquare
    Square <|-- MoveForwardSquare
    Square <|-- RollAgainSquare
    Square <|-- SnackSquare
    Square <|-- DrinkSquare
    Square <|-- ObligationSquare
    Square <|-- CheckpointSquare
    Square <|-- BivioSquare
    Square <|-- PortalSquare
    InteractiveSquare <|.. BivioSquare
    InteractiveSquare <|.. PortalSquare`;
const { svg } = await mermaid.render('domain-diagram-svg', diagramSource);
document.getElementById('domain-diagram').innerHTML = svg;

document.querySelectorAll('#domain-diagram svg.classDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#domain-diagram svg.classDiagram .row-rect-odd path, #domain-diagram svg.classDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
