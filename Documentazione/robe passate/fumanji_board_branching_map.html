<h2 class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Diagramma dei bivi e dei percorsi del tabellone Fumanji dalla partenza al checkpoint</h2>
<div id="board-graph"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const diagramSource = `flowchart TD
    start["Partenza"]
    bivioA{{"Bivio A<br/>effetto: snack"}}
    bivioB{{"Bivio B<br/>effetto: obbligo"}}
    bivioC{{"Bivio C<br/>effetto: turca"}}
    bivioD{{"Bivio D<br/>effetto: startover"}}
    preCP{{"Bivio instradamento<br/>nessun effetto"}}
    checkpoint(("Checkpoint<br/>JUMANJI"))
    fine["FINE"]

    start -->|"obbligo, turca, h2o,<br/>startover, no smoke"| bivioA
    bivioA -->|"dritto: 2 tiri, turca"| bivioB
    bivioA -->|"destra: 2 tiri, obbligo"| bivioC
    bivioC -->|"su: startover, h2o"| bivioD
    bivioC -->|"destra: h2o, portale1, no smoke, turca,<br/>snack, 2 tiri, portale6, obbligo,<br/>h2o, turca, portale4, crea"| preCP
    bivioB -->|"destra: startover, no smoke"| bivioD
    bivioB -->|"sinistra: h2o, portale2, no smoke, turca,<br/>obbligo, portale5, snack, 2 tiri,<br/>obbligo, h2o, portale3, crea"| preCP
    bivioD -->|"snack, startover, crea"| preCP
    preCP --> checkpoint
    checkpoint -->|"29 celle senza bivi, gia' confermate"| fine`;
const { svg } = await mermaid.render('board-graph-svg', diagramSource);
document.getElementById('board-graph').innerHTML = svg;
</script>
