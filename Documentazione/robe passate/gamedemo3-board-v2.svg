<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>

  <!-- Tronco comune: partenza -> bivio -->
  <line x1="60" y1="170" x2="220" y2="170" stroke="#333333" stroke-width="4"/>
  <!-- Tronco comune: ricongiungimento -> arrivo -->
  <line x1="620" y1="170" x2="840" y2="170" stroke="#333333" stroke-width="4"/>
  <polygon points="840,162 860,170 840,178" fill="#333333"/>

  <!-- Percorso principale (sopra) -->
  <path d="M 220 170 C 300 90, 380 90, 460 90 L 540 90 C 580 90, 600 120, 620 170"
        fill="none" stroke="#2980b9" stroke-width="4"/>
  <!-- Percorso alternativo (sotto) -->
  <path d="M 220 170 C 300 250, 380 250, 460 250 L 540 250 C 580 250, 600 220, 620 170"
        fill="none" stroke="#c0392b" stroke-width="4"/>

  <!-- PARTENZA (0) -->
  <circle cx="60" cy="170" r="9" fill="#27ae60"/>
  <text x="60" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">PARTENZA (0)</text>

  <!-- BIVIO (5) -->
  <polygon points="220,152 240,170 220,188 200,170" fill="#e67e22" stroke="#a85a1a" stroke-width="2"/>
  <text x="220" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#e67e22">BIVIO (5)</text>
  <text x="220" y="205" text-anchor="middle" font-size="12" fill="#555555">opzioni: 6 oppure 10</text>

  <!-- Percorso principale: caselle proprie -->
  <circle cx="300" cy="97" r="6" fill="#2980b9"/>
  <text x="300" y="80" text-anchor="middle" font-size="12" fill="#2980b9">6</text>
  <circle cx="380" cy="90" r="6" fill="#2980b9"/>
  <text x="380" y="73" text-anchor="middle" font-size="12" fill="#2980b9">7</text>
  <circle cx="460" cy="90" r="10" fill="#2980b9" stroke="#1c5a80" stroke-width="2"/>
  <text x="460" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#2980b9">CHECKPOINT (8)</text>
  <circle cx="540" cy="90" r="6" fill="#2980b9"/>
  <text x="540" y="73" text-anchor="middle" font-size="12" fill="#2980b9">9 (redirect)</text>

  <!-- Percorso alternativo: caselle proprie -->
  <circle cx="300" cy="243" r="6" fill="#c0392b"/>
  <text x="300" y="263" text-anchor="middle" font-size="12" fill="#c0392b">10</text>
  <circle cx="380" cy="250" r="10" fill="#c0392b" stroke="#7b1f14" stroke-width="2"/>
  <text x="380" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">OBBLIGO (11)</text>
  <circle cx="460" cy="250" r="6" fill="#c0392b"/>
  <text x="460" y="270" text-anchor="middle" font-size="12" fill="#c0392b">12 (redirect)</text>

  <!-- RICONGIUNGIMENTO (20) -->
  <polygon points="620,152 640,170 620,188 600,170" fill="#333333"/>
  <text x="620" y="140" text-anchor="middle" font-size="14" font-style="italic" fill="#333333">si ricongiungono (20)</text>
  <text x="620" y="205" text-anchor="middle" font-size="12" fill="#555555">indietro: scelta tra 9 e 12</text>

  <!-- ARRIVO (30) -->
  <circle cx="840" cy="170" r="9" fill="#27ae60"/>
  <text x="840" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">ARRIVO (30)</text>

  <!-- Legenda -->
  <text x="60" y="320" font-size="13" fill="#333333" font-weight="bold">Legenda:</text>
  <polygon points="70,338 80,346 70,354 60,346" fill="#e67e22"/>
  <text x="90" y="350" font-size="13" fill="#333333">BivioSquare</text>
  <line x1="190" y1="346" x2="220" y2="346" stroke="#2980b9" stroke-width="4"/>
  <text x="230" y="350" font-size="13" fill="#333333">percorso principale</text>
  <line x1="400" y1="346" x2="430" y2="346" stroke="#c0392b" stroke-width="4"/>
  <text x="440" y="350" font-size="13" fill="#333333">percorso alternativo</text>
</svg>
